openapi: 3.0.3
info:
  title: GitHub Connector
  version: 1.0.0
  description: Search GitHub repositories and inspect issue, PR, and file data.
servers:
  - url: https://your-domain.example.com
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK

  /github/search/repositories:
    get:
      summary: Search GitHub repositories
      operationId: searchRepositories
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Repository search results

  /github/repos/{owner}/{repo}:
    get:
      summary: Get repository metadata
      operationId: getRepository
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository metadata

  /github/repos/{owner}/{repo}/issues:
    get:
      summary: List repository issues
      operationId: listIssues
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of issues

  /github/repos/{owner}/{repo}/pulls:
    get:
      summary: List repository pull requests
      operationId: listPullRequests
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [open, closed, merged, all]
            default: open
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of pull requests

  /github/repos/{owner}/{repo}/contents/{path}:
    get:
      summary: Read a file or directory from a repository
      operationId: getFileContent
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: ref
          required: false
          schema:
            type: string
            default: HEAD
      responses:
        '200':
          description: File or directory content
